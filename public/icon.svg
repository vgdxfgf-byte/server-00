<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#1d4ed8" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background Card -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect x="8" y="8" width="496" height="496" rx="104" fill="none" stroke="#334155" stroke-width="4" stroke-opacity="0.6" />

  <!-- Shield Shape -->
  <g filter="url(#shadow)">
    <path d="M256 80 L390 136 C390 270 332 376 256 424 C180 376 122 270 122 136 Z" fill="url(#blueGrad)" />
  </g>

  <!-- Inner Shield Highlight -->
  <path d="M256 104 L370 152 C370 264 320 354 256 396 C192 354 142 264 142 152 Z" fill="none" stroke="#93c5fd" stroke-width="4" stroke-opacity="0.4" />

  <!-- Indian Rupee / Payout Flow Symbol (₹) -->
  <g fill="#ffffff">
    <!-- Top Bar -->
    <rect x="196" y="168" width="120" height="20" rx="10" />
    <!-- Second Bar -->
    <rect x="196" y="210" width="120" height="20" rx="10" />
    <!-- Vertical Stem -->
    <rect x="226" y="168" width="22" height="170" rx="11" />
    <!-- Upper Loop -->
    <path d="M246 168 C294 168 316 190 316 226 C316 262 284 274 246 274 L236 274 L236 254 L246 254 C272 254 292 246 292 226 C292 206 276 188 246 188 Z" />
    <!-- Diagonal Leg -->
    <path d="M240 264 L306 352 C312 360 306 372 294 372 L270 372 C262 372 254 366 248 358 L198 288 L224 264 Z" />
  </g>

  <!-- Flow Payout Accent Arrow -->
  <circle cx="340" cy="180" r="16" fill="#10b981" />
  <path d="M334 180 L346 180 M342 174 L348 180 L342 186" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
</svg>
